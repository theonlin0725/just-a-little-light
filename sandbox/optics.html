<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <title>就差一点光 · 光学沙盒</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4efe4;
        --dim: #9aa8bb;
        --line: rgba(160, 210, 255, 0.18);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #05060a;
        color: var(--ink);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      }
      #app { display: flex; flex-direction: column; height: 100%; }
      #top {
        padding: 10px 12px 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 14px;
        letter-spacing: 0.08em;
        font-weight: 650;
        margin: 0 6px 0 0;
        white-space: nowrap;
        color: #f8e9c8;
      }
      #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      button {
        font: inherit;
        color: var(--dim);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 11px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { color: var(--ink); border-color: rgba(160, 210, 255, 0.4); }
      button.active {
        color: #071018;
        background: linear-gradient(180deg, #ffe7b6, #e8b96c);
        border-color: transparent;
        font-weight: 700;
      }
      #reset { margin-left: auto; }
      #stageWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
      canvas { display: block; touch-action: none; border-radius: 14px; box-shadow: 0 20px 80px rgba(0, 0, 0, 0.55); }
      #hint {
        padding: 8px 16px 14px;
        text-align: center;
        color: var(--dim);
        font-size: 12px;
        line-height: 1.5;
      }
      #hint b { color: #f3d79c; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="top">
        <h1>就差一点光 · 光学沙盒</h1>
        <nav id="tabs" aria-label="机制样板"></nav>
        <button id="reset" type="button">重置</button>
      </header>
      <div id="stageWrap"><canvas id="stage" width="720" height="1280"></canvas></div>
      <div id="hint"></div>
    </div>
    <script type="module" src="./optics.js"></script>
  </body>
</html>
