<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./assets/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>就差一点光</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="就差一点光 · 光影解谜小游戏" role="img"></canvas>
    <!-- 图标按钮的无障碍替身：视觉隐藏，但可聚焦、有名字 -->
    <div class="sr-only">
      <!-- 顺序与底栏图标一致：选关 → 重来 → 提示 → 皮肤 → 首页 -->
      <button id="btn-levels" aria-label="打开选关" title="选关">选关</button>
      <button id="btn-restart" aria-label="重新开始当前关卡" title="重来">重来</button>
      <button id="btn-hint" aria-label="打开提示" title="提示">提示</button>
      <button id="btn-skins" aria-label="打开光源皮肤面板" title="光源皮肤">光源皮肤</button>
      <button id="btn-home" aria-label="返回首页" title="返回首页">返回首页</button>
    </div>
    <div id="a11y-status" class="sr-only" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
